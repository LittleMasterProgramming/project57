<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Circularity OS - Bangladesh Industrial Waste Exchange</title>
    <meta name="description" content="Autonomous By-Product & Secondary Raw Material Matcher across Bangladesh Industrial Manufacturing Nodes" />
    <meta property="og:title" content="Circularity OS - Bangladesh Industrial Waste Exchange" />
    <meta property="og:description" content="Autonomous By-Product & Secondary Raw Material Matcher across Bangladesh Industrial Manufacturing Nodes" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts: Poppins & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style type="text/tailwindcss">
@import "tailwindcss";

@theme {
  --color-primary: #4edea3;
  --color-primary-container: #10b981;
  --color-on-primary: #003824;
  --color-on-primary-container: #00422b;
  --color-primary-fixed: #6ffbbe;
  --color-primary-fixed-dim: #4edea3;
  --color-secondary: #4cd7f6;
  --color-secondary-container: #03b5d3;
  --color-on-secondary: #003640;
  --color-on-secondary-container: #00424e;
  --color-tertiary: #ffb95f;
  --color-tertiary-container: #e29100;
  --color-on-tertiary: #472a00;
  --color-surface: #0f131d;
  --color-surface-dim: #0f131d;
  --color-surface-bright: #353944;
  --color-surface-variant: #313540;
  --color-surface-container-lowest: #0a0e18;
  --color-surface-container-low: #171b26;
  --color-surface-container: #1c1f2a;
  --color-surface-container-high: #262a35;
  --color-surface-container-highest: #313540;
  --color-on-surface: #dfe2f1;
  --color-on-surface-variant: #bbcabf;
  --color-outline: #86948a;
  --color-outline-variant: #3c4a42;
  --color-error: #ffb4ab;
  --color-error-container: #93000a;
  --font-sans: 'Poppins', sans-serif;
}

@layer base {
  html, body {
    width: 100%;
    margin: 0;
    padding: 0;
    background-color: #0f131d;
    color: #dfe2f1;
    font-family: 'Poppins', sans-serif;
  }
  
  body {
    overscroll-behavior-y: none;
  }

  .pb-safe {
    padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
  }

  .pt-safe {
    padding-top: max(env(safe-area-inset-top, 0px), 0px);
  }
}

/* Material Symbols Font Setup */
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 24px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
}

/* Typography Utility Classes matching Design System */
.font-display-lg {
  font-size: 40px;
  line-height: 48px;
  letter-spacing: -0.02em;
  font-weight: 700;
}

.font-display-lg-mobile {
  font-size: 30px;
  line-height: 38px;
  letter-spacing: -0.01em;
  font-weight: 700;
}

.font-headline-lg {
  font-size: 28px;
  line-height: 36px;
  letter-spacing: -0.01em;
  font-weight: 600;
}

.font-headline-md {
  font-size: 20px;
  line-height: 28px;
  font-weight: 600;
}

.font-headline-sm {
  font-size: 16px;
  line-height: 24px;
  font-weight: 600;
}

.font-title-md {
  font-size: 15px;
  line-height: 22px;
  font-weight: 500;
}

.font-body-lg {
  font-size: 16px;
  line-height: 24px;
  font-weight: 400;
}

.font-body-md {
  font-size: 14px;
  line-height: 20px;
  font-weight: 400;
}

.font-body-sm {
  font-size: 12px;
  line-height: 18px;
  font-weight: 400;
}

.font-label-lg {
  font-size: 13px;
  line-height: 16px;
  letter-spacing: 0.04em;
  font-weight: 600;
}

.font-label-md {
  font-size: 11px;
  line-height: 14px;
  letter-spacing: 0.06em;
  font-weight: 500;
}

.font-label-xs {
  font-size: 10px;
  line-height: 12px;
  letter-spacing: 0.08em;
  font-weight: 600;
}

/* Dark-styled Leaflet Tiles */
.dark-map-tiles .leaflet-tile-pane {
  filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
}

.leaflet-container {
  background-color: #0b0f19 !important;
  font-family: 'Poppins', sans-serif !important;
}

.leaflet-popup-content-wrapper {
  background: #1c1f2a !important;
  color: #dfe2f1 !important;
  border-radius: 8px !important;
  border: 1px solid #3c4a42 !important;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7) !important;
}

.leaflet-popup-tip {
  background: #1c1f2a !important;
}

.leaflet-control-attribution {
  background: rgba(15, 19, 29, 0.85) !important;
  color: #86948a !important;
  font-size: 9px !important;
}
.leaflet-control-attribution a {
  color: #4edea3 !important;
}

/* Hide scrollbars but keep smooth scrolling */
::-webkit-scrollbar {
  display: none;
}
